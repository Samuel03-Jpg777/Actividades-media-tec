<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body background="cozy.webp" style="background-repeat: no-repeat; background-size: cover; background-position: center; background-attachment: fixed;">
    <table border="1" bgcolor="lightgray" align="center">
        <span class="resaltado" style="color: white; font-weight: bold;">
        <h1 align="center">Registro de Usuario</h1>
        </span>
        <form action="register.html">
        <tr>
            <td><label for="username">Nombre de usuario:</label></td>
            <td><input type="text" id="username" name="username" required></td>
        </tr>
        <tr>
            <td><label for="document">Documento:</label></td>
            <td><input type="text" id="document" name="document" required></td>
        </tr>
        <tr>
            <td><label for="address">Dirección:</label></td>
            <td><input type="text" id="address" name="address" required></td>
        </tr>
        <tr>
            <td><label for="phone">Teléfono:</label></td>
            <td><input type="text" id="phone" name="phone" required></td>
        </tr>
            <td><label for="email">Correo electrónico:</label></td>
            <td><input type="email" id="email" name="email" required></td>
        </tr>
        <tr>
            <td><label for="password">Contraseña:</label></td>
            <td><input type="password" id="password" name="password" required></td>
        </tr>
        <tr>
            <td colspan="3" align="center"><input type="submit" value="Registrar"></td>
        </tr>
    </table>

    </form>
</body>
</html>
