<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <main>
        <section id="formulario">
            <h2>Formulario de consulta</h2>

            <form action="#" method="post">

                <p>
                    <label for="nombre">Nombre completo:</label>
                    <input
                        type="text"
                        id="nombre"
                        name="nombre"
                        placeholder="Escribe tu nombre"
                        required
                    >
                </p>

                <p>
                    <label for="correo">Correo electrónico:</label>
                    <input
                        type="email"
                        id="correo"
                        name="correo"
                        placeholder="ejemplo@correo.com"
                        required
                    >
                </p>

                <p>
                    <label for="videojuego">Selecciona un videojuego:</label>

                    <select id="videojuego" name="videojuego" required>
                        <option value="">Selecciona una opción</option>
                        <option value="sa2">Sonic Adventure 2</option>
                        <option value="generations">Sonic Generations</option>
                        <option value="mania">Sonic Mania</option>
                        <option value="frontiers">
                            Sonic Frontiers
                        </option>
                    </select>
                </p>

                <p>
                    <label for="tipo-consulta">Tipo de consulta:</label>

                    <select
                        id="tipo-consulta"
                        name="tipo-consulta"
                        required
                    >
                        <option value="">Selecciona una opción</option>
                        <option value="requisitos">
                            Requisitos del sistema
                        </option>
                        <option value="plataformas">
                            Plataformas disponibles
                        </option>
                        <option value="historia">
                            Información de la historia
                        </option>
                        <option value="general">
                            Consulta general
                        </option>
                    </select>
                </p>

                <p>
                    <label for="mensaje">Mensaje:</label>
                    <br>
                    <textarea
                        id="mensaje"
                        name="mensaje"
                        rows="5"
                        cols="40"
                        placeholder="Escribe tu consulta"
                    ></textarea>
                </p>

                <p>
                    <button type="submit">Enviar consulta</button>
                    <button type="reset">Limpiar formulario</button>
                </p>

            </form>
        </section>
    </main>
</body>
</html>
