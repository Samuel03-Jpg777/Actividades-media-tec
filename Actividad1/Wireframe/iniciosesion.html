<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="login.html">
        <table border="1" bgcolor="lightgray" align="center">
            <span class="resaltado" style="color: white; font-weight: bold;">
            <h1 align="center">Inicio de Sesión</h1>
            </span>
            <tr>
                <td><label for="username">Nombre de usuario:</label></td>
                <td><input type="text" id="username" name="username" required></td>
            </tr>
            <tr>
                <td><label for="password">Contraseña:</label></td>
                <td><input type="password" id="password" name="password" required></td>
            </tr>
            <tr>
                <td colspan="3" align="center">
                    <p>¿Ya tienes una cuenta? <a href="register.html">Regístrate aquí</a></p>
                </td>
            </tr>
            <tr>
                <td colspan="3" align="center"><input type="submit" value="Iniciar Sesión"></td>
            </tr>
        </table>
    </form>
</body>
</html>
